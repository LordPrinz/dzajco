<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dzajco — the best link shortener you were looking for</title>
		<meta
			name="description"
			content="Free link shortener with QR codes, custom names, expiry and start dates, password protection and click analytics." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
			rel="stylesheet" />
		<script>
			// Applied before first paint so the theme never flashes.
			try {
				const t = localStorage.getItem("dzajco:theme");
				const dark =
					t === "dark" ||
					(!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
				if (dark) document.documentElement.classList.add("dark");
			} catch (e) {}
		</script>
	</head>
	<body class="h-full">
		<div id="root" class="h-full"></div>
		<script type="module" src="/src/client/main.tsx"></script>
	</body>
</html>
