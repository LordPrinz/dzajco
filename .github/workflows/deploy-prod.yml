name: Deploy prod

# Every push to main (a release merge from dev) deploys the production Worker to https://dzaj.de
# once the owner approves the `production` environment.
# There is no smoke check yet: dzaj.de still points to the old site until the DNS switch.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a running deploy is never cancelled half way through a migration.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions: {}

env:
  HUSKY: "0"
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"

jobs:
  deploy:
    name: Deploy dzaj.de
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: https://dzaj.de
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # wrangler and workerd need Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - run: bun install --frozen-lockfile
      # The same checks as `deploy`, before anything touches the production database.
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:worker
      - run: bun run build:client
      - run: bun run check:size
      - name: Migrate the production database
        run: bun run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: bunx wrangler deploy --env="" --var PUBLIC_ORIGIN:https://dzaj.de
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
