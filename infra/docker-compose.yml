name: dzajco

services:
  # The Worker under `wrangler dev` with a local D1 database. No Cloudflare account or token needed;
  # without CF_AE_TOKEN the app uses LocalVisitSource, so fresh stats are empty.
  web:
    build:
      context: ..
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Dev-only default. Put a different value in infra/.env (untracked) to override it.
      SECRET_PEPPER_V1: ${SECRET_PEPPER_V1:-dev-only-pepper-not-a-secret}
    volumes:
      - d1-state:/app/.wrangler/state
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  d1-state:
