name: E2E

on:
  pull_request:
  push:
    branches: [v3.0]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  HUSKY: "0"

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - run: bun install --frozen-lockfile
      - run: bun run build:client
      - run: bunx playwright install --with-deps chromium
      - name: Local secrets for the test server
        run: echo "SECRET_PEPPER_V1=e2e-ci-pepper" > .dev.vars
      - run: bun run db:migrate:local
      - name: Start the Worker
        run: |
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV=false nohup bunx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf --max-time 2 http://localhost:8787/healthz && exit 0
            sleep 1
          done
          cat wrangler.log
          exit 1
      - run: bun run test:e2e
      - run: bun run test:lhci
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            playwright-report
            test-results
            .lighthouseci
            wrangler.log
          if-no-files-found: ignore
          retention-days: 7
