version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # PR titles become "[DZAJ-15] build(deps): Bump …", which passes the title convention.
    commit-message:
      prefix: "[DZAJ-15] build"
      include: scope
    # Skip releases younger than a week; most malicious npm versions are pulled within days.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "[DZAJ-15] ci"
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "[DZAJ-15] build"
      include: scope
