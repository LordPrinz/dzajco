name: Task
description: Chore, tooling or documentation work
labels: ["type:chore"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core, web, api, db, stats, ui, infra, docs]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs doing and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions that define "done".
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, constraints, open questions.
